name: Bug report / 问题反馈
description: 翻译没反应、译文不对、界面异常等
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提 issue 前请先看一眼 README 的「敲了三次空格没反应？按这个顺序排查」一节，
        大部分情况那里已经有答案。

        **不要把 API Key 贴进 issue。** 截图里也请打码。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 简述现象，以及你期望的结果
      placeholder: 在 Gmail 的正文框里连敲三次空格，没有任何反应，也没有提示。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 xxx 页面
        2. 点进 xxx 输入框
        3. 输入中文，连敲三次空格
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 出问题的网站
      placeholder: mail.google.com
    validations:
      required: false
  - type: dropdown
    id: engine
    attributes:
      label: 当时用的是哪个引擎
      description: 设置页「免费引擎」和「AI 翻译服务」里能看出来
      options:
        - 只有免费引擎（没配 AI 服务商）
        - 免费引擎 + AI 服务商
        - 只用 AI 服务商（免费引擎关了）
        - 不清楚
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 弹窗左下角或设置页顶部显示的那个 v 开头的版本号
      placeholder: v1.11.0
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome 版本
      placeholder: 在 chrome://version 里能看到
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 报错信息（可选）
      description: 设置页右键 → 检查 → Console，把红色文字贴过来。注意先去掉里面的 Key。
      render: text
    validations:
      required: false
